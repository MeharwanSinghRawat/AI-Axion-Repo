apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: axion
  labels:
    app.kubernetes.io/name: ingestion-service
    app.kubernetes.io/part-of: axion-platform
    environment: production
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
        app.kubernetes.io/name: ingestion-service
        app.kubernetes.io/part-of: axion-platform
        environment: production
    spec:
      containers:
        - name: ingestion-service
          image: acrudayaksdemo.azurecr.io/axion-ingestion:1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: axion-db-secret
                  key: DATABASE_URL
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: axion-common-config
                  key: ALLOWED_ORIGINS
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: axion
  labels:
    app.kubernetes.io/name: ingestion-service
    app.kubernetes.io/part-of: axion-platform
    environment: production
spec:
  type: ClusterIP
  selector:
    app: ingestion-service
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
