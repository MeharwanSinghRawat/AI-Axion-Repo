apiVersion: v1
kind: ConfigMap
metadata:
  name: axion-schema-config
  namespace: axion
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: axion-platform
    environment: production
data:
  01-extensions.sql: |
    -- Axion Extensions
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";

  02-telemetry.sql: |
    -- Axion Telemetry Table
    CREATE TABLE IF NOT EXISTS telemetry (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        device_id VARCHAR(50) NOT NULL,
        device_type VARCHAR(20) NOT NULL,
        refinery_region VARCHAR(50) NOT NULL,
        timestamp TIMESTAMP NOT NULL,
        temperature DOUBLE PRECISION NOT NULL,
        vibration DOUBLE PRECISION NOT NULL,
        current DOUBLE PRECISION NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_telemetry_device_id
    ON telemetry(device_id);

    CREATE INDEX IF NOT EXISTS idx_telemetry_timestamp
    ON telemetry(timestamp DESC);

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: axion-simulator-config
  namespace: axion
  labels:
    app.kubernetes.io/name: simulator-service
    app.kubernetes.io/part-of: axion-platform
    environment: production
data:
  API_URL: "http://ingestion-service.axion.svc.cluster.local:80/api/v1/telemetry/ingest"
  INTERVAL_SECONDS: "5"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: axion-common-config
  namespace: axion
  labels:
    app.kubernetes.io/part-of: axion-platform
    environment: production
data:
  ALLOWED_ORIGINS: "*"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: axion-ui-config
  namespace: axion
  labels:
    app.kubernetes.io/name: axion-ui
    app.kubernetes.io/part-of: axion-platform
    environment: production
data:
  config.js: |
    // Runtime configuration injected by Kubernetes ConfigMap
    window.__ENV__ = {
      API_BASE: "http://20.241.145.37:8000"
    };
