# =============================================================================
# Reusable Template: Kubernetes Workload Deployment & Rollout Verification
# Task: KubernetesManifest@1 (Using Azure Resource Manager / azurerm connection)
# =============================================================================

parameters:
  - name: stepTitle
    type: string
  - name: deploymentName
    type: string
    default: ''
  - name: azureSubscriptionConnection
    type: string
    default: 'aks-connection'
  - name: azureResourceGroup
    type: string
    default: 'rg-aks-Uday'
  - name: kubernetesCluster
    type: string
    default: 'aks-demo-cluster'
  - name: namespace
    type: string
    default: 'axion'
  - name: manifests
    type: string
  - name: containers
    type: string
    default: ''
  - name: timeoutSeconds
    type: string
    default: '120'

steps:
  - task: KubernetesManifest@1
    displayName: '${{ parameters.stepTitle }}'
    inputs:
      action: 'deploy'
      connectionType: 'azureResourceManager'
      azureSubscriptionConnection: '${{ parameters.azureSubscriptionConnection }}'
      azureResourceGroup: '${{ parameters.azureResourceGroup }}'
      kubernetesCluster: '${{ parameters.kubernetesCluster }}'
      namespace: '${{ parameters.namespace }}'
      manifests: '${{ parameters.manifests }}'
      ${{ if ne(parameters.containers, '') }}:
        containers: '${{ parameters.containers }}'

  # Health & Rollout Verification task
  - task: Kubernetes@1
    displayName: 'Verify Rollout Status: ${{ parameters.stepTitle }}'
    continueOnError: false
    inputs:
      connectionType: 'Azure Resource Manager'
      azureSubscriptionEndpoint: '${{ parameters.azureSubscriptionConnection }}'
      azureResourceGroup: '${{ parameters.azureResourceGroup }}'
      kubernetesCluster: '${{ parameters.kubernetesCluster }}'
      namespace: '${{ parameters.namespace }}'
      command: 'rollout'
      ${{ if ne(parameters.deploymentName, '') }}:
        arguments: 'status deployment/${{ parameters.deploymentName }} --timeout=${{ parameters.timeoutSeconds }}s'
      ${{ if eq(parameters.deploymentName, '') }}:
        arguments: 'status -f ${{ parameters.manifests }} --timeout=${{ parameters.timeoutSeconds }}s'
